services:
  # ---- MongoDB ----
  mongo:
    image: mongo:7
    container_name: interview-ai-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  # ---- Backend (Express API) ----
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: interview-ai-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./Backend/.env
    environment:
      - MONGO_URI=mongodb://mongo:27017/interview-ai
    depends_on:
      - mongo
    networks:
      - app-network

  # ---- Frontend (React served by Nginx) ----
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3000
    container_name: interview-ai-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo-data:
    driver: local

networks:
  app-network:
    driver: bridge
